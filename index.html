<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hero">
        <img src="band-photo.png" alt="Svev band photo">
        <div class="hero-overlay">
            <div class="hero-text">
                <h1>Svev</h1>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="intro">
            <p class="tagline">
                A trio merging nordic folk music, classical music and electronics
            </p>
        </div>

        <div class="divider"></div>

        <section class="video-section">
            <div class="video-carousel">
                <button class="carousel-arrow" id="prevBtn">&#8249;</button>
                <div class="video-thumb" id="carouselThumb">
                    <div class="video-thumb-img">
                        <img id="carouselImg" src="" alt="">
                        <div class="play-btn"></div>
                    </div>
                    <div class="video-thumb-label" id="carouselLabel"></div>
                </div>
                <button class="carousel-arrow" id="nextBtn">&#8250;</button>
            </div>
            <p class="video-credit">Recorded at <a href="https://www.transformatorscene.no" target="_blank" rel="noopener">Transformator Scene</a></p>
            <p class="members">
                Øystein Stensheim · Simon Berg · Bjørn-Atle Reme
            </p>
        </section>

        <div class="video-modal" id="videoModal">
            <div class="video-modal-inner">
                <button class="video-modal-close" id="videoModalClose">&times;</button>
                <div class="video-modal-wrapper">
                    <iframe id="videoModalFrame" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <section class="music-section">
            <h2>Listen More</h2>

            <div class="audio-grid">
                <div class="audio-container">
                    <div class="audio-title">Bach</div>
                    <audio controls>
                        <source src="bach.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>

                <div class="audio-container">
                    <div class="audio-title">Dufay</div>
                    <audio controls>
                        <source src="vergene.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>

                <div class="audio-container">
                    <div class="audio-title">Stranger</div>
                    <audio controls>
                        <source src="outro1.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>

                <div class="audio-container">
                    <div class="audio-title">Stranger II</div>
                    <audio controls>
                        <source src="outro2.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>
            </div>
        </section>

        <div class="divider"></div>

        <section class="booking-card">
            <a class="booking-btn" href="booking.html">Booking</a>
        </section>

        <footer>
            &copy; 2026 Svev
        </footer>
    </div>
    <script>
        const videos = [
            { id: 'kMK1OHDtRAE', label: 'Framand' },
            { id: 'sNM2RXPrZ8k', label: 'Dvorak' },
            { id: '9ZDCnkGbRj0', label: 'Blake' }
        ];

        let current = 0;

        const thumb = document.getElementById('carouselThumb');
        const img = document.getElementById('carouselImg');
        const label = document.getElementById('carouselLabel');

        function showVideo(index) {
            const v = videos[index];
            img.src = `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`;
            img.alt = v.label;
            label.textContent = v.label;
            thumb.dataset.id = v.id;
        }

        showVideo(current);

        document.getElementById('prevBtn').addEventListener('click', () => {
            current = (current - 1 + videos.length) % videos.length;
            showVideo(current);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            current = (current + 1) % videos.length;
            showVideo(current);
        });

        const modal = document.getElementById('videoModal');
        const frame = document.getElementById('videoModalFrame');
        const closeBtn = document.getElementById('videoModalClose');

        thumb.addEventListener('click', () => {
            frame.src = `https://www.youtube.com/embed/${videos[current].id}?autoplay=1`;
            modal.classList.add('active');
        });

        function closeModal() {
            modal.classList.remove('active');
            frame.src = '';
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
